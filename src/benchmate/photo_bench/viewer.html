<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BenchMate · 사진 검토</title>
<style>
:root{font-family:system-ui,sans-serif;color:#192d33;background:#f5f6f1}*{box-sizing:border-box}body{margin:0}header{padding:22px 28px;background:#fff;border-bottom:1px solid #dce3df;display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:22px;margin:0 0 6px}p{margin:4px 0;color:#52676b;font-size:14px;line-height:1.5}.pill{padding:6px 12px;border:1px solid #c5d8cf;border-radius:30px;background:#eef7f0;white-space:nowrap;font-size:13px}.layout{display:grid;grid-template-columns:290px 1fr;height:calc(100vh - 116px);min-height:500px}aside{overflow:auto;padding:16px;border-right:1px solid #dce3df}input[type=search]{width:100%;padding:10px;border:1px solid #b9cbc8;border-radius:6px;background:white;margin-bottom:12px}button{cursor:pointer;background:#fff;border:1px solid #c5d4d0;border-radius:7px;padding:9px 13px;color:#192d33;font:inherit;font-size:13px}button:focus-visible,input:focus-visible{outline:3px solid #e8af44;outline-offset:2px}.thumb{display:grid;grid-template-columns:72px 1fr;gap:12px;text-align:left;width:100%;margin-bottom:9px;align-items:center}.thumb[aria-pressed=true]{border:2px solid #176856;background:#e9f4ed}.thumb img{width:72px;height:78px;object-fit:contain;background:#e1e7e4}.thumb b{display:block;font-size:13px}.thumb small{font-size:11px;color:#5b6f70;line-height:1.7}.workspace{min-width:0;display:flex;flex-direction:column;overflow:hidden}.toolbar{padding:14px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff}#name{font-weight:700;margin-right:auto}label{font-size:13px}.canvas{flex:1;overflow:auto;padding:20px;background:#dfe6e1;position:relative;min-height:240px}#picture{display:block;max-width:none;cursor:crosshair;box-shadow:0 2px 12px #20382d20}footer{background:#fff;padding:14px 22px;border-top:1px solid #cbd7d2;display:grid;gap:4px;font-size:13px}#status{font-variant-numeric:tabular-nums;color:#176856}#error{color:#9c2d26}#notice{color:#75571e}#count{font-size:12px;margin:0 0 12px}@media(max-width:700px){header{padding:16px;display:block}.pill{display:inline-block;margin-top:10px}.layout{display:flex;flex-direction:column;height:auto;min-height:0}aside{max-height:240px;border-right:0}.workspace{height:75vh}.toolbar{padding:12px}h1{font-size:20px}}
</style>
<header><div><h1>사진에서 시작하는 BenchMate</h1><p>겹친 배선을 확대해서 확인할 개발 자료야. 사진마다 회로 상태가 다를 수 있어.</p></div><span class="pill">로컬 검토 · 외부 전송 없음</span></header>
<div class="layout"><aside><input id="search" type="search" placeholder="파일 이름으로 찾기" aria-label="사진 검색"><p id="count">사진 목록 불러오는 중…</p><div id="list"></div></aside>
<main class="workspace"><div class="toolbar"><span id="name">사진 선택</span><button id="fit">화면에 맞춤</button><button id="full">원본 해상도</button><label>확대 <input id="zoom" type="range" min="10" max="200" value="25" aria-label="원해상도 기준 확대 비율"></label><span id="percent">25%</span><button id="export" disabled>선택 지점 저장</button></div>
<div class="canvas" id="canvas"><img id="picture" alt="선택한 회로 사진"></div>
<footer><strong id="notice">동일한 배선 상태인지 미확인 — 여러 사진을 합쳐 연결을 확정하지 않아.</strong><span id="dimensions"></span><span id="status">사진의 접점을 누르면 원해상도 기준 좌표를 확인할 수 있어.</span><span id="error" role="alert"></span></footer></main></div>
<script>
let photos=[],selected=null,points=[],full=false;
const el=id=>document.getElementById(id),pic=el('picture');
function size(){if(!selected)return;const z=+el('zoom').value/100;pic.style.width=(selected.master.width*z)+'px';el('percent').textContent=Math.round(z*100)+'%';}
function fit(){if(!selected)return;const c=el('canvas');el('zoom').value=Math.max(10,Math.min(200,Math.floor(100*Math.min((c.clientWidth-40)/selected.master.width,(c.clientHeight-40)/selected.master.height))));size();}
function select(record){selected=record;points=[];full=false;el('export').disabled=true;el('name').textContent=record.source_name;el('dimensions').textContent=`${record.master.width} × ${record.master.height} · 위치정보 제거 확인 · 개별 개발 사진`;el('status').textContent='접점을 누르면 원해상도 기준 좌표를 확인할 수 있어.';el('full').textContent='원본 해상도';pic.src=record.directory+'/overview.png';pic.alt=record.source_name+' 회로 사진';fit();render();}
function render(){const q=el('search').value.toLowerCase();el('list').replaceChildren();for(const p of photos.filter(p=>p.source_name.toLowerCase().includes(q))){const b=document.createElement('button');b.className='thumb';b.setAttribute('aria-pressed',String(p.id===selected?.id));const img=document.createElement('img');img.src=p.directory+'/overview.png';img.alt='';img.loading='lazy';const wrap=document.createElement('span'),name=document.createElement('b'),note=document.createElement('small');name.textContent=p.source_name;note.textContent='배선 상태 미확인';wrap.append(name,note);b.append(img,wrap);b.onclick=()=>select(p);el('list').append(b);}}
pic.onerror=()=>el('error').textContent='사진을 불러오지 못했어. 로컬 서버와 파일을 확인해 줘.';
el('zoom').oninput=size;el('fit').onclick=fit;el('search').oninput=render;
el('full').onclick=()=>{if(!selected)return;full=!full;pic.src=selected.directory+(full?'/master.png':'/overview.png');el('full').textContent=full?'빠른 미리보기':'원본 해상도';el('status').textContent=full?'원해상도 픽셀 표시. 확대해도 없는 디테일을 생성하지 않아.':'축소 미리보기야. 접점 판독은 원본 해상도에서 확인해.';};
pic.onclick=event=>{if(!selected||!pic.complete||!pic.naturalWidth)return;const r=pic.getBoundingClientRect(),x=(event.clientX-r.left)*selected.master.width/r.width,y=(event.clientY-r.top)*selected.master.height/r.height;points.push({x,y,meaning:'unlabelled manual point',view:full?'master':'overview'});el('export').disabled=false;el('status').textContent=`지점 ${points.length}: x ${x.toFixed(1)}, y ${y.toFixed(1)} · 아직 구멍 주소나 전기 연결을 뜻하지 않아.`;};
el('export').onclick=()=>{const record={schema:'benchmate.manual_photo_points.v1',photo_id:selected.id,master_sha256:selected.master.sha256,coordinate_system:'oriented-master pixel edges',same_state_verified:false,points};const url=URL.createObjectURL(new Blob([JSON.stringify(record,null,2)+'\n'],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=selected.id+'-points.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
fetch('manifest.json').then(r=>{if(!r.ok)throw Error('사진 목록을 읽지 못했어.');return r.json();}).then(m=>{photos=m.records.filter(p=>p.master);el('count').textContent=`${photos.length}장 · 처리 실패 ${m.failures.length}장`;if(photos.length)select(photos.find(p=>p.source_name==='IMG_8887.HEIC')||photos[0]);}).catch(e=>el('error').textContent=e.message);
</script>
</html>
