<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'">
<title>BenchMate · Experiment record</title>
<style>
:root{--ink:#173d36;--muted:#69756d;--paper:#f4f3ec;--line:#d9ded4;--green:#166c51;--orange:#bb5b30;--blue:#416cbe}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:Inter,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;font-size:14px}header{padding:22px 5%;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-size:24px;font-weight:800;letter-spacing:-1px}.brand span{font-weight:400;color:var(--muted);font-size:13px;letter-spacing:.02em;margin-left:16px}.pill{border:1px solid #beccbe;border-radius:24px;padding:7px 12px;font-size:11px;letter-spacing:.07em;font-weight:700;white-space:nowrap}.pill.warn{color:#8b461e;background:#fff1dc;border-color:#ead1b0}main{max-width:1440px;margin:auto;padding:34px 5%}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);font-weight:700}h1{font-size:36px;letter-spacing:-1.2px;line-height:1.2;margin:10px 0 12px}p{line-height:1.7;margin:0}.lead{color:var(--muted);max-width:850px}.meta{display:flex;gap:24px;flex-wrap:wrap;margin:23px 0}.metric{font-size:24px;font-weight:700}.metric small{display:block;font-size:11px;font-weight:500;letter-spacing:.06em;color:var(--muted);margin-top:5px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;min-height:150px}.card .eyebrow{margin-bottom:13px}.card p{font-size:14px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}.panel{border:1px solid var(--line);background:#fff;border-radius:12px;overflow:hidden}.panel-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.panel-head h2{font-size:15px;margin:0}.subtle{color:var(--muted);font-size:12px}.chart-wrap{padding:14px 18px}#chart{width:100%;height:300px;display:block}.legend{display:flex;flex-wrap:wrap;gap:10px 20px;padding:0 24px 20px;font-size:11px;color:var(--muted)}.dot{display:inline-block;width:18px;height:3px;background:var(--green);vertical-align:middle;margin-right:6px}.dot.pred{background:var(--orange)}.dot.drive{background:var(--blue)}.controls{display:flex;align-items:center;gap:12px;padding:18px 0}button,select{font:inherit;color:var(--ink);background:white;border:1px solid #cbd3c9;border-radius:7px;padding:9px 12px;cursor:pointer}button:hover{background:#eaf1e8}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #6caea0;outline-offset:2px}input[type=range]{flex:1;min-width:0;accent-color:var(--green)}#timeline{max-height:510px;overflow:auto;padding:10px}.event{display:block;width:100%;text-align:left;border:0;background:transparent;margin:3px 0;padding:11px;border-radius:7px;font-size:12px}.event.active{background:#e8f1e6;font-weight:700}.event small{display:block;margin-top:5px;font-size:10px;color:var(--muted);font-weight:400}.lower{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.body{padding:20px}.body pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.6;margin:10px 0 0}#wiring{width:100%;height:145px}details{margin-top:20px;border-top:1px solid var(--line);padding-top:16px}summary{cursor:pointer;color:var(--muted)}#raw{white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto;font-size:11px;line-height:1.5}footer{margin-top:28px;color:var(--muted);font-size:11px;line-height:1.7;overflow-wrap:anywhere}.empty{color:var(--muted)}@media(max-width:900px){.workspace{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.card{min-height:0}#timeline{max-height:220px}.lower{grid-template-columns:1fr}header{flex-wrap:wrap}h1{font-size:29px}.brand span{display:block;margin:6px 0 0}.metric{font-size:20px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="brand">BenchMate<span>MEASURE · PREDICT · VERIFY</span></div><span id="source" class="pill warn">RECORDED EXPERIMENT</span></header>
<main>
<div class="eyebrow">Execution evidence / 실행 기록</div>
<h1 id="headline">다음 측정을 선택하고, 예측을 확인하다.</h1>
<p class="lead" id="scope"></p>
<div class="meta"><div class="metric" id="status"></div><div class="metric" id="count"></div><div class="metric" id="model"></div><div class="metric" id="duration"></div></div>
<div class="cards"><article class="card"><div class="eyebrow">01 · 현재 설명</div><p id="explanation"></p></article><article class="card"><div class="eyebrow">02 · 남은 불확실성</div><p id="uncertainty"></p></article><article class="card"><div class="eyebrow">03 · 다음 관측</div><p id="next"></p></article></div>
<div class="controls"><button id="play">기록 재생</button><input type="range" id="cursor" min="0" value="0" aria-label="실행 기록 시점"><span id="position" class="subtle"></span><button id="download">JSONL 저장</button></div>
<div class="workspace"><section class="panel"><div class="panel-head"><h2 id="plotTitle">관측과 예측</h2><span id="plotNote" class="subtle"></span></div><div class="chart-wrap"><svg id="chart" viewBox="0 0 900 300" role="img" aria-label="관측 출력, 사전 예측 및 구동 파형"></svg></div><div class="legend"><span><i class="dot"></i>관측 OUT</span><span><i class="dot pred"></i>기록된 사전 예측</span><span><i class="dot drive"></i>관측 DRIVE</span></div><div class="body"><p class="subtle" id="verification"></p></div></section><aside class="panel"><div class="panel-head"><h2>실험의 흐름</h2><span class="subtle">기록 순서</span></div><nav id="timeline" aria-label="실행 단계"></nav></aside></div>
<div class="lower"><section class="panel"><div class="panel-head"><h2>장착 상태</h2><span class="subtle">논리 노드 · 실제 배치도 아님</span></div><div class="body"><svg id="wiring" viewBox="0 0 600 145" role="img" aria-label="구동, 션트, 회로, 부하의 논리 연결"></svg><p class="subtle" id="instruction"></p></div></section><section class="panel"><div class="panel-head"><h2>제안 · 수리 · 실행 근거</h2></div><div class="body"><p id="evidenceNote" class="subtle"></p><pre id="evidence"></pre></div></section></div>
<details><summary>현재 이벤트 원본</summary><pre id="raw"></pre></details>
<footer id="integrity"></footer>
</main>
<script type="application/json" id="record">/*RECORD_DATA*/</script>
<script>
'use strict';
const record=JSON.parse(document.getElementById('record').textContent),events=record.events;
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const labels={run_started:'실행 시작',inference_configuration:'사전분포·메뉴 설정',discovery_configuration:'제안·검증 조건 분리',acquisition:'관측 취득',diagnosis:'관측에 따른 판정',action_ranking:'추가 측정 순위',instrument_request:'장착·측정 요청',tool_call:'모델의 도구 선택',netlist_proposed:'Spark 구조 제안',proposal_fit:'제안 구조의 적합',proposal_rejected:'제안 거절',prediction_committed:'검증 전 예측 고정',verification_acquisition:'독립 검증 관측',verification:'예측 검증',agent_report:'세 칸 보고',repair_requested:'수리 요청',repair_prediction_committed:'수리 전 예측 고정',repair_applied:'합성 부품 교체',repair_verification_acquisition:'수리 후 관측',repair_verification:'수리 검증',run_completed:'실행 완료',run_failed:'실행 실패',raw_capture:'미보정 원시 취득'};
const statuses={unresolved:'미확정',verification_required:'검증 대기',verified_within_declared_candidates:'후보군 내 검증',all_candidates_inadequate:'후보 모두 부적합',prediction_failed:'예측 불일치',integration_unresolved:'수치 적분 미확정',repair_verified:'수리 예측 통과',repair_not_verified:'수리 예측 실패'};
let cursor=events.length-1,timer=null;
function text(id,value){$(id).textContent=value==null?'—':String(value)}
function svg(parent,tag,attrs={},content){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,String(v));if(content!==undefined)e.textContent=String(content);parent.appendChild(e);return e}
function last(list,kinds){return [...list].reverse().find(e=>kinds.includes(e.kind))}
function metric(id,value,label){$(id).replaceChildren(document.createTextNode(value));const s=document.createElement('small');s.textContent=label;$(id).appendChild(s)}
function sameSettings(a,b){return ['kind','shunt_ohm','load_ohm','amplitude_v','frequency_hz','duration_s','sample_period_s'].every(k=>(a?.[k]??null)===(b?.[k]??null))}
function chart(series,unit,xLabel='Time (s)'){const root=$('chart');root.replaceChildren();const width=Math.max(320,root.clientWidth);root.setAttribute('viewBox',`0 0 ${width} 300`);const valid=series.filter(s=>s.x?.length&&s.y?.length&&s.x.length===s.y.length&&[...s.x,...s.y].every(Number.isFinite));if(!valid.length){svg(root,'text',{x:width/2,y:150,'text-anchor':'middle',fill:'#69756d'},'이 시점에는 표시할 파형이 없습니다.');return}const allX=valid.flatMap(s=>s.x),allY=valid.flatMap(s=>s.y);let xmin=Math.min(...allX),xmax=Math.max(...allX),ymin=Math.min(...allY),ymax=Math.max(...allY);if(xmax===xmin)xmax=xmin+1;const padding=Math.max(.05,(ymax-ymin)*.12);ymin-=padding;ymax+=padding;const X=v=>60+(width-85)*(v-xmin)/(xmax-xmin),Y=v=>255-220*(v-ymin)/(ymax-ymin);for(let i=0;i<=4;i++){const v=ymin+(ymax-ymin)*i/4;svg(root,'line',{x1:60,y1:Y(v),x2:width-25,y2:Y(v),stroke:'#e5e8df'});svg(root,'text',{x:50,y:Y(v)+4,'text-anchor':'end',fill:'#69756d','font-size':11},v.toFixed(unit==='V'?2:0))}for(let i=0;i<=4;i++){const v=xmin+(xmax-xmin)*i/4;svg(root,'text',{x:X(v),y:278,'text-anchor':'middle',fill:'#69756d','font-size':11},v.toFixed(3))}svg(root,'text',{x:60,y:17,fill:'#69756d','font-size':11},unit);svg(root,'text',{x:width-25,y:298,'text-anchor':'end',fill:'#69756d','font-size':11},xLabel);for(const s of valid){let d='';const step=Math.max(1,Math.floor(s.x.length/1800));for(let i=0;i<s.x.length;i+=step)d+=(d?'L':'M')+X(s.x[i]).toFixed(2)+','+Y(s.y[i]).toFixed(2);svg(root,'path',{d,fill:'none',stroke:s.color,'stroke-width':s.dashed?2.5:1.8,'stroke-dasharray':s.dashed?'7 4':'none'})}}
function wiring(settings){const root=$('wiring');root.replaceChildren();const line=(x1,y1,x2,y2)=>svg(root,'line',{x1,y1,x2,y2,stroke:'#829789','stroke-width':2});line(35,45,565,45);for(const [x,label]of [[35,'DRIVE'],[230,'IN'],[430,'OUT']]){svg(root,'circle',{cx:x,cy:45,r:4,fill:'#166c51'});svg(root,'text',{x,y:22,'text-anchor':'middle',fill:'#173d36','font-size':12},label)}svg(root,'rect',{x:90,y:30,width:110,height:30,rx:4,fill:'#edf4e9',stroke:'#829789'});svg(root,'text',{x:145,y:49,'text-anchor':'middle',fill:'#173d36','font-size':11},settings?.shunt_ohm?'1 kΩ shunt':'0 Ω jumper');svg(root,'rect',{x:275,y:25,width:105,height:40,rx:5,fill:'#173d36'});svg(root,'text',{x:327,y:50,'text-anchor':'middle',fill:'white','font-size':12},'Circuit');line(327,65,327,120);line(35,120,565,120);svg(root,'text',{x:35,y:142,fill:'#69756d','font-size':11},'REF');if(settings?.load_ohm){line(500,45,500,120);svg(root,'rect',{x:464,y:67,width:72,height:27,rx:3,fill:'#fff1dc',stroke:'#be9f7c'});svg(root,'text',{x:500,y:85,'text-anchor':'middle',fill:'#173d36','font-size':11},settings.load_ohm/1000+' kΩ')}text('instruction',settings?`션트 ${settings.shunt_ohm||0} Ω · OUT–REF 부하 ${settings.load_ohm??'없음'} · ${settings.kind} · 합성 장착은 실제 사람 조작이 아닙니다.`:'장착 정보가 아직 없습니다.')}
function render(){const visible=events.slice(0,cursor+1),terminal=last(visible,['run_completed','run_failed']),result=terminal?.payload||{};const config=last(visible,['provider_configuration'])?.payload;const report=last(visible,['agent_report'])?.payload;const diagnosis=last(visible,['diagnosis'])?.payload;const rawMode=events[0]?.payload?.mode||'';const hardware=rawMode.startsWith('hardware');text('source',hardware?'UNCALIBRATED HARDWARE · RECORDING':'SYNTHETIC DATA · RECORDING');text('scope',hardware?'미보정 원시 계측 기록입니다. 전압 정확도나 회로 진단을 검증한 결과가 아닙니다.':'저장된 실행 기록을 재생합니다. 실제 보드·부품 교체·홀드아웃 검증 결과가 아닙니다.');const status=terminal?.kind==='run_failed'?'실행 실패':result.status||result.final_report?.status||(terminal?.kind==='run_completed'?(report?.verdict==='verified'?'verified_within_declared_candidates':report?.verdict==='abstained'?'보류':'완료'):diagnosis?.status||'진행 중');metric('status',statuses[status]||status,'CURRENT STATUS');const used=visible.filter(e=>['acquisition','verification_acquisition','repair_verification_acquisition'].includes(e.kind)).reduce((n,e)=>n+(e.payload.physical_acquisitions||1),0);metric('count',String(used),'ACQUISITIONS · 탐색 포함');metric('model',config?`${config.model} · ${config.reasoning_effort}`:'Engine / local tools','RECORDED ACTOR');metric('duration',((new Date(events[cursor].timestamp)-new Date(events[0].timestamp))/1000).toFixed(1)+' s','RECORDED TIMESPAN');text('explanation',report?.current_explanation||diagnosis?.current_explanation?.join(' / ')||statuses[diagnosis?.status]||'관측을 확인하는 단계입니다.');text('uncertainty',report?.unresolved||diagnosis?.unresolved||'이 시점의 기록만 표시합니다. 뒤에 나온 결론은 아직 표시하지 않습니다.');const nextAction=last(visible,['instrument_request']);text('next',report?.next_observation||nextAction?.payload.instruction||'다음 기록으로 이동해 측정 요청과 결과를 확인하세요.');const focus=last(visible,['acquisition','verification_acquisition','repair_verification_acquisition','prediction_committed','repair_prediction_committed','raw_capture']);let series=[],settings=focus?.payload.settings;const p=focus?.payload;let unit='V';if(focus?.kind==='raw_capture'){unit='ADC counts';if(p?.rows){series=[{x:p.rows.map(r=>(r[0]+r[7])/1e6),y:p.rows.map(r=>r[3]),color:'#166c51'}]}else if(p?.samples){series=[{x:p.samples.map(r=>r.t_us[1]/1e6),y:p.samples.map(r=>r.raw[1]),color:'#166c51'}]}}else if(focus?.kind.includes('prediction_committed')){const data=p.prediction?.mean||p.prediction;series=[{x:data?.time_s,y:data?.out_v,color:'#bb5b30',dashed:true}]}else if(p?.data){const data=p.data,x=data.time_s||data.drive_v;series=[{x,y:data.out_v,color:'#166c51'},{x,y:data.drive_v,color:'#416cbe'}];const pk=focus.kind==='repair_verification_acquisition'?'repair_prediction_committed':'prediction_committed';const prior=[...visible].reverse().find(e=>e.sequence<focus.sequence&&e.kind===pk&&sameSettings(e.payload.settings,settings));if(prior){const prediction=prior.payload.prediction.mean||prior.payload.prediction;series.push({x:prediction.time_s||x,y:prediction.out_v,color:'#bb5b30',dashed:true})}}chart(series,unit,settings?.kind==='dc_pair'?'DC drive level (V)':'Time (s)');text('plotTitle',focus?labels[focus.kind]:'관측과 예측');text('plotNote',settings?`${settings.kind} · ${settings.amplitude_v} V · load ${settings.load_ohm??'none'}`:'기록된 데이터만 표시');const verification=last(visible,['verification','repair_verification']);text('verification',verification?`${verification.payload.passed?'검증 통과':'검증 실패'} · 검증 데이터 재적합 ${verification.payload.refitted_on_verification?'있음':'없음'} · 선언한 후보와 조건 안의 결과`:'검증 전에는 확정으로 표시하지 않습니다.');if(verification?.kind==='repair_verification'){text('explanation',verification.payload.passed?'교체 전에 고정한 예측과 수리 후 두 관측 조건이 일치했습니다.':'수리 후 관측이 사전 예측과 맞지 않았습니다. 수리 성공으로 확정하지 않습니다.');text('uncertainty','합성 부품 교체 결과입니다. 실제 부품 교체와 계측 오차는 아직 검증하지 않았습니다.');text('next','D2 보정 후 실제 회로에서 같은 수리 전후 조건을 재측정합니다.')}wiring(settings);const evidence=last(visible,['proposal_fit','netlist_proposed','repair_requested','repair_applied','instrument_request']);text('evidenceNote',evidence?labels[evidence.kind]:'해당 단계의 실제 실행 근거가 여기에 표시됩니다.');text('evidence',evidence?(evidence.payload.rendered_fitted_proposal||JSON.stringify(evidence.payload,null,2)):'—');text('raw',JSON.stringify(events[cursor],null,2));text('position',`${cursor+1} / ${events.length}`);$('cursor').value=cursor;for(const button of $('timeline').children)button.classList.toggle('active',Number(button.dataset.index)===cursor);text('integrity',`원본 해시 연결은 내보내기 시 확인했습니다. 이 HTML은 독립 인증이나 외부 타임스탬프가 아닙니다. API 재호출 없이 재생됩니다.\nRun: ${record.run_id} · Source SHA-256: ${record.source_sha256}`)}
for(let i=0;i<events.length;i++){const event=events[i];if(!labels[event.kind])continue;const b=document.createElement('button');b.className='event';b.dataset.index=i;b.textContent=labels[event.kind];const s=document.createElement('small');s.textContent=`#${event.sequence} · ${new Date(event.timestamp).toLocaleTimeString('ko-KR',{timeZone:'Asia/Seoul'})} KST`;b.appendChild(s);b.onclick=()=>{stop();cursor=i;render()};$('timeline').appendChild(b)}
function stop(){if(timer)clearInterval(timer);timer=null;text('play','기록 재생')}
$('cursor').max=events.length-1;$('cursor').oninput=e=>{stop();cursor=Number(e.target.value);render()};
$('play').onclick=()=>{if(timer){stop();return}cursor=0;render();text('play','일시 정지');timer=setInterval(()=>{if(cursor>=events.length-1){stop();return}cursor++;render()},800)};
$('download').onclick=()=>{const blob=new Blob([events.map(e=>JSON.stringify(e)).join('\n')+'\n'],{type:'application/x-ndjson'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=record.run_id+'-events.jsonl';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
window.addEventListener('resize',render);render();
</script>
</body></html>
