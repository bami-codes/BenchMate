<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>verify</title>
<style>
html,body{margin:0;height:100%;background:#5c6b76;background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1px);background-size:22px 22px;font-family:"Archivo Narrow","Archivo",system-ui,sans-serif}
.term{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.75);transform-origin:center;width:1560px;height:760px;background:#0e1315;border-radius:10px;border:1px solid #000;box-shadow:0 30px 80px -30px rgba(0,0,0,.8);color:#dfe9e3;padding:28px 34px;box-sizing:border-box;font:24px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;overflow:hidden}
.term .bar{position:absolute;left:0;right:0;top:0;height:34px;background:#141c1f;border-radius:10px 10px 0 0;border-bottom:1px solid #27343a}
.term .bar i{position:absolute;top:11px;width:12px;height:12px;border-radius:50%;background:#2f3a3f}.term .bar i:nth-child(1){left:14px}.term .bar i:nth-child(2){left:34px}.term .bar i:nth-child(3){left:54px}
.term .body{margin-top:26px}
.p{color:#9fb0aa}.c{color:#fff}.pass{color:#6fe39a;font-weight:600}.k{color:#c6a9ff}.m{color:#aab8b3;font-size:20px}
.cur{display:inline-block;width:12px;height:26px;background:#dfe9e3;vertical-align:-4px;animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.cap{position:absolute;left:0;right:0;bottom:40px;text-align:center;color:#fff;font:600 30px/1.3 "Archivo Narrow",system-ui,sans-serif;text-shadow:0 2px 12px rgba(0,0,0,.6)}
</style></head><body>
<div class="term"><div class="bar"><i></i><i></i><i></i></div><div class="body" id="b"></div></div>
<script>
// The command lines and outputs are the ones recorded on 4 Nov 2026 on the public copies in examples/ (see README).
const lines = [
 ['c', '$ git clone https://github.com/bami-codes/BenchMate && cd BenchMate'],
 ['m', '# no packages, no API key, no network, no hardware: the verifier reads the records only'],
 ['c', '$ PYTHONPATH=src python3 -S -m benchmate verify examples/reading-cohort/2026-11-03/records/20261103T125924-bf8f64512b/diagnosis-faulted/20261103T130826-26d83af2df'],
 ['pass', 'PASS events=247 forecasts=4 measurements=5 order_checks=19 prediction_files=1 run_status=run_completed head_sha256=390f8d0c… scope=internal_integrity+recorded_order creation_time=unproven'],
 ['c', '$ PYTHONPATH=src python3 -S -m benchmate.reading_terminal_pair verify examples/reading-cohort/2026-11-03/records/20261103T150223-18d6f08ac9'],
 ['pass', 'PASS events=607 forecasts=10 measurements=10 order_checks=45 prediction_files=3 run_status=run_completed head_sha256=d0e887cb…'],
 ['c', '$ PYTHONPATH=src python3 -S -m benchmate.reading_wire_stage verify examples/reading-cohort/2026-11-03/records/20261104T021333-c80ef3617e'],
 ['pass', 'PASS events=484 forecasts=8 measurements=9 order_checks=33 prediction_files=2 run_status=run_completed head_sha256=8fc8fe18…'],
 ['c', '$ PYTHONPATH=src python3 -S -m benchmate.reading_restored_after_photo_v5 verify examples/reading-cohort/2026-11-03/records/20261104T051005-fac3d07c86'],
 ['pass', 'PASS events=583 forecasts=4 measurements=5 order_checks=19 prediction_files=1 run_status=run_completed head_sha256=5c667bad…'],
 ['m', '# every event hash-chained; every forecast hash checked against the event that froze it; forecast → CAPTURE → measurement order enforced'],
];
const b = document.getElementById('b'); let i = 0;
function next() {
  if (i >= lines.length) { b.insertAdjacentHTML('beforeend', '<span class="cur"></span>'); return; }
  const [cls, txt] = lines[i++]; const el = document.createElement('div'); el.className = cls; b.append(el);
  if (cls === 'c') { let k = 0; const t = setInterval(() => { el.textContent = txt.slice(0, ++k); if (k >= txt.length) { clearInterval(t); setTimeout(next, 350); } }, 9); }
  else { el.textContent = txt; setTimeout(next, cls === 'pass' ? 700 : 500); }
}
setTimeout(next, 500);
</script>
</body></html>
