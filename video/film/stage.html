<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>BenchMate film stage</title>
<link rel="stylesheet" href="../../site/assets/v3.css">
<style>
/* One sheet, one camera. The film shares the site's stylesheet; this file only places the site's parts on the world and adds the camera, captions and the few film-only pieces (title, pins, hash chain, loop, close). */
@font-face{font-family:"Archivo";src:url(../fonts/Archivo-var.ttf) format("truetype");font-weight:100 900}
@font-face{font-family:"Archivo Narrow";src:url(../fonts/ArchivoNarrow-var.ttf) format("truetype");font-weight:100 900}
@font-face{font-family:"IBM Plex Mono";src:url(../fonts/IBMPlexMono-400.woff2) format("woff2");font-weight:400}
@font-face{font-family:"IBM Plex Mono";src:url(../fonts/IBMPlexMono-600.woff2) format("woff2");font-weight:600}
:root{--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--mat);background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1px);background-size:22px 22px;font:15px/1.5 var(--sans);color:var(--ink)}
*,*::before,*::after{transition:none !important;animation:none !important}
#view{position:absolute;inset:0;overflow:hidden}
#world{position:absolute;left:0;top:0;width:15600px;height:3000px;transform-origin:0 0}
.ws{position:absolute}
.cue{opacity:0}
.grow{overflow:hidden}
/* ---- A. title */
#photo{left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#2a3338}
#photo img{position:absolute;left:50%;top:50%;width:1920px;height:auto;transform-origin:center}
#photo .grade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.10),rgba(0,0,0,0) 35%,rgba(0,0,0,.28))}
#photo .vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.35))}
#photolab{left:96px;top:980px}
.tape2{display:inline-block;white-space:nowrap;background:var(--tape);color:var(--tape-ink);font:600 26px/1 var(--narrow);padding:12px 20px;transform:rotate(-1.2deg);box-shadow:0 2px 4px rgba(0,0,0,.25)}
.tape2.white{background:#fff;color:var(--ink)}
#lines{left:96px;top:380px;width:1728px}
#lines .ln{font:600 112px/1.08 var(--narrow);letter-spacing:-.008em;color:#fff;white-space:nowrap;height:122px;position:relative}
#lines .ln .txt{position:relative;display:inline-block}
#lines .ln.wrong .txt{color:#ffd1cd}
#lines .ln.wrong .ul{position:absolute;left:0;bottom:-6px;height:9px;background:var(--fault);width:0;border-radius:2px}
#lines .caret{display:inline-block;width:6px;height:96px;background:#fff;vertical-align:-10px;margin-left:8px;opacity:0}
#sub1{left:96px;top:950px;font:500 34px/1.3 var(--narrow);color:rgba(255,255,255,.85)}
#sub1 b{color:#fff}
/* ---- B. setup */
.fframe{position:absolute;background:#fff;border:2px solid var(--ink);border-radius:10px;box-shadow:0 24px 60px -30px rgba(0,0,0,.7);overflow:hidden}
#drawn{left:2200px;top:350px;width:900px;height:374px;padding:24px 28px}
#drawn img{width:100%;height:100%;object-fit:contain}
#built{left:3180px;top:120px;width:620px;height:826px}
#built img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#labdrawn{left:2218px;top:322px}#labbuilt{left:3198px;top:92px}
.flab .tape2{font-size:24px;padding:10px 18px}
.pin{position:absolute;width:44px;height:44px;border-radius:50%;background:#fff;color:var(--ink);border:3px solid var(--ink);font:700 22px/38px var(--narrow);text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.5);transform:translate(-50%,-50%) scale(0)}
#key{left:3180px;top:966px;display:flex;gap:26px;font:400 22px/1.25 var(--sans);color:#fff}
#key i{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;border:2px solid #fff;font:700 15px/1 var(--narrow);font-style:normal;margin-right:8px;vertical-align:-6px}
#key b{font-weight:600}
#frontier{left:2200px;top:150px;transform:rotate(-.8deg)}
#seal{left:3460px;top:745px;width:300px;transform:rotate(-7deg) scale(0);transform-origin:center;border:3px solid var(--fault);color:var(--fault);font:700 26px/1.1 var(--narrow);padding:10px 14px;border-radius:5px;letter-spacing:.05em;background:rgba(255,255,255,.9);text-transform:uppercase;box-shadow:0 6px 18px rgba(0,0,0,.35)}
#seal small{display:block;font:500 13px/1.25 var(--mono);letter-spacing:0;text-transform:none;color:#8a2a24;margin-top:4px}
/* ---- C/D. case workspaces */
.case .strip{display:flex;gap:18px;align-items:baseline;font:500 20px/1 var(--narrow);color:#fff;white-space:nowrap}
.case .strip b{font-weight:700;font-size:22px}
.case .strip .fc{color:#c6a9ff}.case .strip .out{color:#7fb0ff}.case .strip .in{color:#6fe39a}
.case .scope{width:1700px;height:560px}
.case .scope .hud{font-size:17px;gap:14px;left:16px;top:auto;bottom:10px}
.case .strip{position:absolute;left:16px;top:12px;z-index:3}
.case .scope .title{font-size:19px;right:16px;top:12px}
.case .scope .sweep{font-size:18px;right:16px;bottom:10px}
.case .scope .read,.case .scope .legend{display:none}
.case .meters{display:flex;flex-direction:column;gap:14px;width:330px;position:relative}
.case .meters .meter .name{font-size:15px}.case .meters .meter .read{font-size:13px;gap:8px}
.case .book{width:1340px;padding:22px 32px 30px 0;background:var(--paper);border-radius:6px;box-shadow:0 1px 0 rgba(0,0,0,.3),0 20px 50px -30px rgba(0,0,0,.8)}
.case .book::before{content:"";position:absolute;left:84px;top:0;bottom:0;width:1px;background:rgba(213,52,44,.35)}
.case .entry{grid-template-columns:62px minmax(0,1fr);padding:10px 0}
.case .entry .lead{font-size:24px}.case .entry .body{font-size:17.5px}.case .entry .who{font-size:14px}
.case .exp-title{display:flex;align-items:center;gap:12px;font:600 24px/1.2 var(--narrow);margin:2px 0 6px}
.case .exp-title .n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;font-size:15px}
.case .quote{font:600 20px/1.35 var(--narrow);color:var(--ink);margin:0 0 6px}
.case .mchip{font-size:13.5px}.case .mchip small{font-size:11.5px}
.case .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.case .chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);border-radius:999px;padding:5px 11px;font:500 14px/1 var(--narrow);background:#fff}
.case .chip i{display:inline-block;width:18px;border-top:2px dashed var(--fc)}
.case .chip.sha,.case .chip.commit{font-family:var(--mono);font-size:13px}
.case .fit-table{font-size:16px;margin-top:6px;max-width:1100px}
.case .fit-table th{font-size:13px}.case .fit-table td{padding:8px 10px 8px 0}
.case .bands{font-size:16px;margin-top:8px;max-width:900px;border-collapse:collapse}
.case .bands th{text-align:left;font:600 13px/1.2 var(--narrow);color:var(--ink-2);padding:4px 10px 6px 0;border-bottom:1px solid var(--rule)}
.case .bands td{padding:8px 10px 8px 0;border-bottom:1px solid var(--paper-3)}
.case .bands .b{font:600 20px/1.1 var(--narrow)}
.case .photo{max-width:560px;margin-top:8px}
.case .photo .masklabel{font-size:14px;padding:6px 9px}
.case .typed{display:inline-block;font:600 44px/1.1 var(--narrow);padding:8px 16px;background:#fff;border:2px solid var(--ink);border-radius:6px;margin:6px 0;min-width:180px}
.case .typed .cr{display:inline-block;width:3px;height:40px;background:var(--ink);vertical-align:-6px;margin-left:4px}
.case .verdict-card{margin-top:4px;max-width:1120px}
.case .verdict-card .big{font-size:30px}
.case .verdict-card .vs.planted .big{font-size:26px}
.case .verdict-card .lab{font-size:13px}
.case .card.propose{margin-top:6px;max-width:980px}
.case .schem-wrap svg{width:100%;height:auto}
.case .scores{display:flex;gap:40px;margin-top:8px;align-items:baseline}
.case .scores b{font:600 64px/1 var(--narrow);color:var(--ok)}
.case .scores span{font:400 16px/1.3 var(--sans);color:var(--ink-2);display:block;margin-top:4px}
.case .scores .allow b{color:var(--ink)}
.case .mini{width:760px;padding:22px 26px;background:var(--paper);border-radius:6px;box-shadow:0 1px 0 rgba(0,0,0,.3),0 20px 50px -30px rgba(0,0,0,.8)}
.case .mini h3{font-size:22px;margin:0 0 6px}
.case .mini p{font-size:16px;color:var(--ink-2);margin:0 0 8px}
/* ---- E. trust */
#chain{display:flex;gap:18px;align-items:center}
#chain .hv{display:flex;flex-direction:column;gap:8px;padding:16px 18px;background:var(--paper);border-radius:6px;min-width:230px;box-shadow:0 1px 0 rgba(0,0,0,.3)}
#chain .hv b{font:600 20px/1.2 var(--narrow)}
#chain .hv code{font:500 15px/1.2 var(--mono);color:var(--ink-2)}
#chain .hv .prev{font-size:13px;color:var(--ink-3)}
#chain .link{width:40px;height:2px;background:#fff;opacity:.7;position:relative}
#chain .link::after{content:"";position:absolute;right:-1px;top:-5px;border:6px solid transparent;border-left-color:#fff}
#census{display:grid;grid-template-columns:repeat(5,230px);gap:18px}
#census .ck{background:var(--paper);border-radius:6px;padding:16px 18px;box-shadow:0 1px 0 rgba(0,0,0,.3)}
#census .ck b{display:block;font:600 64px/1 var(--narrow)}
#census .ck span{display:block;font-size:15px;color:var(--ink-2);margin-top:8px;line-height:1.3}
#term{width:1680px;height:800px;background:var(--scope);border-radius:12px;border:1px solid #000;box-shadow:0 30px 80px -30px rgba(0,0,0,.8);color:var(--phosphor);padding:52px 40px 30px;font:400 24px/1.45 var(--mono);overflow:hidden}
#term .bar{position:absolute;left:0;right:0;top:0;height:38px;background:#141c1f;border-radius:12px 12px 0 0;border-bottom:1px solid #27343a}
#term .bar b{position:absolute;left:0;right:0;top:9px;text-align:center;font:500 16px/1 var(--narrow);color:#8a9aa2}
#term .m{color:#aab8b3;font-size:22px;margin-bottom:10px}
#term .c{color:#fff;white-space:pre-wrap;overflow-wrap:anywhere}
#term .pass{color:#6fe39a;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0 22px}
#term .rows{margin-top:6px;display:grid;grid-template-columns:44px minmax(0,1fr) 300px;gap:8px 16px;align-items:baseline;font-size:21px}
#term .rows .k{color:#6fe39a;font-weight:600}#term .rows .n{color:#dfe9e3}#term .rows .n small{display:block;color:#8a9aa2;font-size:16px;margin-top:2px}#term .rows .v{color:#8a9aa2;font-size:16px;text-align:right;white-space:nowrap}
#term .foot{position:absolute;left:40px;right:40px;bottom:26px;font:400 19px/1.4 var(--narrow);color:#8a9aa2;border-top:1px solid #27343a;padding-top:12px}
#term .foot b{color:#c9d4cf}
/* ---- F. loop */
#loopsheet{width:1680px;height:896px;background:var(--paper);border-radius:10px;box-shadow:0 1px 0 rgba(0,0,0,.25),0 30px 70px -36px rgba(0,0,0,.7)}
#loopsheet .ltitle{position:absolute;left:56px;top:40px;font:600 40px/1.15 var(--narrow)}
#loopsheet .ltitle small{display:block;font:400 22px/1.3 var(--sans);color:var(--ink-2);margin-top:6px}
#loopsheet svg{position:absolute;left:0;top:0}
#loopsheet .st rect{fill:#fff;stroke:var(--ink);stroke-width:2}
#loopsheet .st .n{font:600 15px var(--narrow);fill:var(--ink)}
#loopsheet .st .h{font:600 24px/1 var(--narrow);fill:var(--ink)}
#loopsheet .st .here{font:400 17px var(--sans);fill:var(--ink-2)}
#loopsheet .st .alt{font:400 17px var(--sans);fill:#8a2a24;opacity:0}
#loopsheet .arrow{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
#loopsheet .ltag{position:absolute;left:1300px;top:44px;transform:rotate(1.2deg)}
#loopsheet .ltag .tape2{font-size:22px;background:#fff;color:#8a2a24;border:2px solid #d7b4af}
#loopsheet .lline{position:absolute;left:56px;bottom:40px;right:56px;font:600 34px/1.25 var(--narrow)}
#loopsheet .lline span{color:var(--ink-2);font-weight:400;font-size:26px;display:block;margin-top:6px;font-family:var(--sans)}
/* ---- G. close */
#close{width:1728px}
#close .crow{opacity:0}
#close .ch{font:600 64px/1.1 var(--narrow);color:#fff;margin:0 0 10px}
#close .ch .w{color:#ffd1cd;text-decoration:underline;text-decoration-color:var(--fault);text-decoration-thickness:6px;text-underline-offset:9px;text-decoration-skip-ink:none}
#close .cname{font:600 120px/1 var(--narrow);color:#fff;letter-spacing:-.01em;margin:26px 0 8px}
#close .ctag{font:500 44px/1.2 var(--narrow);color:rgba(255,255,255,.9);margin:0 0 42px}
#close .curl{font:600 52px/1.1 var(--mono);color:#fff;margin:0 0 30px;letter-spacing:-.01em}
#close .cmeta{font-size:28px}
#close .cmeta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font:500 28px/1.2 var(--narrow);color:rgba(255,255,255,.85)}
#close .cmeta i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5)}
#close .cbuilt{margin-top:26px}
#close .cfine{margin-top:34px;font:400 22px/1.4 var(--sans);color:rgba(255,255,255,.75);max-width:1400px}
/* ---- screen-space layers */
#cap{position:absolute;left:0;right:0;bottom:46px;display:flex;justify-content:center;pointer-events:none}
#cap span{display:inline-block;background:rgba(14,19,21,.82);color:var(--paper);font:600 30px/1.3 var(--narrow);padding:12px 22px;border-radius:8px;max-width:1500px;text-align:center}
#lower{position:absolute;left:96px;bottom:130px;display:flex;align-items:center;gap:18px;opacity:0}
#lower .dot{width:14px;height:14px;border-radius:50%;background:var(--fc);box-shadow:0 0 0 2px rgba(255,255,255,.35)}
#lower b{font:600 30px/1.2 var(--narrow);color:#fff}
#lower span{font:400 24px/1.2 var(--sans);color:rgba(255,255,255,.82)}
</style></head><body>
<div id="view"><div id="world"></div></div>
<div id="lower"><span class="dot"></span><b>Meta’s Muse Spark 1.3</b><span>Meta Model API · reads the drawing, chooses every experiment, says why</span></div>
<div id="cap"><span id="captxt"></span></div>
<script src="../../site/assets/common.js"></script>
<script src="film.js"></script>
</body></html>
