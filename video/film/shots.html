<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>BenchMate film · shots</title>
<link rel="stylesheet" href="../../site/assets/v3.css">
<style>
/* The film at film scale. Every shot is a composed 1920×1080 frame; the site's scope and meters are used as instruments,
   everything else is set in the film's own type. One easing, one grid (96 px margins), captions on their own line at the bottom. */
@font-face{font-family:"Archivo";src:url(../fonts/Archivo-var.ttf) format("truetype");font-weight:100 900}
@font-face{font-family:"Archivo Narrow";src:url(../fonts/ArchivoNarrow-var.ttf) format("truetype");font-weight:100 900}
@font-face{font-family:"IBM Plex Mono";src:url(../fonts/IBMPlexMono-400.woff2) format("woff2");font-weight:400}
@font-face{font-family:"IBM Plex Mono";src:url(../fonts/IBMPlexMono-600.woff2) format("woff2");font-weight:600}
:root{--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--fault-soft:#ffd1cd}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--mat);background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1px);background-size:22px 22px;font:30px/1.35 var(--sans);color:#fff}
*,*::before,*::after{transition:none !important;animation:none !important}
.shot{position:absolute;inset:0;display:none;transform-origin:center}
.shot.on{display:block}
.abs{position:absolute}
.narrow{font-family:var(--narrow)}
.mono{font-family:var(--mono)}
.ink{color:var(--ink)}
.cue{opacity:0}
/* paper panels */
.paper2{background:var(--paper);color:var(--ink);border-radius:10px;box-shadow:0 1px 0 rgba(0,0,0,.3),0 30px 70px -36px rgba(0,0,0,.7)}
/* type */
.h1{font:600 88px/1.05 var(--narrow);letter-spacing:-.01em}
.h2{font:600 56px/1.1 var(--narrow);letter-spacing:-.006em}
.h3{font:600 40px/1.15 var(--narrow)}
.body{font:400 30px/1.35 var(--sans)}
.small{font:400 24px/1.35 var(--sans)}
.dim{color:rgba(255,255,255,.72)}
.ink .dim,.paper2 .dim{color:var(--ink-2)}
.eyebrow{font:600 22px/1.2 var(--narrow);letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.paper2 .eyebrow{color:var(--ink-2)}
.tape2{display:inline-block;white-space:nowrap;background:var(--tape);color:var(--tape-ink);font:600 26px/1 var(--narrow);padding:12px 20px;transform:rotate(-1.2deg);box-shadow:0 2px 4px rgba(0,0,0,.25)}
.tape2.white{background:#fff;color:var(--ink)}
.tape2.red{background:var(--fault);color:#fff}
.tape2.grey{background:#dcdcd4;color:#333}
.speaker{display:flex;align-items:center;gap:14px;font:600 24px/1.2 var(--narrow)}
.speaker i{width:14px;height:14px;border-radius:50%;background:var(--ink-3);display:inline-block}
.speaker.spark i{background:var(--fc)}.speaker.bench i{background:var(--tape)}.speaker.engine i{background:var(--ink)}.speaker.guard i{background:var(--fault)}
.quote{font:600 44px/1.25 var(--narrow);color:var(--ink);border-left:6px solid var(--fc);padding-left:28px;margin:0}
.quote.white{color:#fff}
.ts{font:500 22px/1 var(--mono);color:var(--ink-3)}
/* captions: their own line, nothing else lives there */
#cap{position:absolute;left:96px;right:96px;top:962px;height:64px;display:flex;align-items:center;justify-content:center;pointer-events:none}
#cap span{font:600 32px/1.2 var(--narrow);color:#fff;text-align:center;max-width:1600px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
#cap span b{color:var(--tape);font-weight:600}
/* the instrument workspace: scope left, meters right */
.ws .strip{position:absolute;left:96px;top:96px;display:flex;gap:26px;align-items:baseline;font:500 26px/1 var(--narrow);color:#fff;white-space:nowrap}
.ws .strip b{font-weight:700;font-size:30px}
.ws .strip .fc{color:#c6a9ff}.ws .strip .out{color:#7fb0ff}.ws .strip .in{color:#6fe39a}
.ws .strip .tag{margin-left:auto}
.ws .scope{position:absolute;left:96px;top:150px;width:1300px;height:600px}
.ws .scope .hud{font-size:22px;gap:16px;left:18px;top:auto;bottom:12px}
.ws .scope .title{font-size:22px;right:18px;top:14px;color:#dfe9e3}
.ws .scope .sweep{font-size:20px;right:18px;bottom:12px}
.ws .scope .read,.ws .scope .legend{display:none}
.ws .meters{position:absolute;left:1420px;top:150px;width:404px;display:flex;flex-direction:column;gap:14px}
.ws .meters .meter{zoom:1.22}
.ws .note{position:absolute;left:96px;top:790px;width:1300px;font:400 30px/1.35 var(--sans);color:#fff}
.ws .note b{font-weight:600}
.ws .note .dim{color:rgba(255,255,255,.72)}
.ws .replay{position:absolute;right:96px;top:96px;font:500 22px/1 var(--narrow);color:rgba(255,255,255,.7);letter-spacing:.02em}
/* meters big */
.meters-big{position:absolute;left:96px;top:300px;width:1728px;display:flex;gap:60px;justify-content:center}
.meters-big .meter{zoom:1.6}
/* menu chips at film scale */
.menu-chips{gap:10px}.mchip{font-size:22px;padding:8px 14px}.mchip small{font-size:17px}
/* range bars */
.range{position:relative;height:64px;margin:0 0 38px}
.range .track{position:absolute;left:0;right:0;top:28px;height:8px;background:rgba(0,0,0,.12);border-radius:4px}
.range .band{position:absolute;top:18px;height:28px;border-radius:6px;background:var(--ok);opacity:.85}
.range .band.off{background:#bdb59c}
.range .band.out{background:#d9c9c1}
.range .lab{position:absolute;top:-36px;font:600 28px/1.2 var(--narrow);color:var(--ink)}
.range .val{position:absolute;top:58px;font:500 22px/1.2 var(--mono);color:var(--ink-2)}
.range .marker{position:absolute;top:2px;width:4px;height:60px;background:var(--ink);border-radius:2px;transform:translateX(-50%)}
.range .marker b{position:absolute;left:50%;top:-44px;transform:translateX(-50%);font:600 30px/1 var(--narrow);white-space:nowrap;color:var(--ink)}
.range .strike{position:absolute;left:0;right:0;top:31px;height:3px;background:var(--fault);transform-origin:left;transform:scaleX(0)}
/* verdict card at film scale */
.vcard{position:absolute;left:96px;top:200px;width:1728px;border:3px solid var(--ok);border-radius:12px;background:#f3fbf5;color:var(--ink);padding:40px 48px}
.vcard.quiet{border-color:var(--ink-3);background:var(--paper-2)}
.vcard .lab{font:600 24px/1.2 var(--narrow);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.vcard .big{font:600 54px/1.15 var(--narrow);margin:10px 0 0}
.vcard .big2{font:600 48px/1.2 var(--narrow);margin:10px 0 0}
.vcard .sep{height:1px;background:rgba(0,0,0,.14);margin:34px 0 30px;border-top:2px dashed rgba(0,0,0,.18);background:none}
.vcard .fine{font:400 24px/1.4 var(--sans);color:var(--ink-2);margin-top:30px}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:14px}
.chip2{display:inline-flex;align-items:center;gap:12px;border:2px solid rgba(255,255,255,.45);border-radius:999px;padding:14px 24px;font:500 28px/1 var(--narrow);color:#fff}
.chip2.mono{font:500 26px/1 var(--mono)}
.chip2 i{display:inline-block;width:26px;border-top:3px dashed var(--fc)}
/* photos */
.photo2{position:relative;overflow:hidden;border-radius:10px;box-shadow:0 30px 70px -36px rgba(0,0,0,.8)}
.photo2 img{display:block;width:100%;height:auto}
.photo2 img.mask{position:absolute;inset:0;width:100%}
.pin{position:absolute;width:56px;height:56px;border-radius:50%;background:#fff;color:var(--ink);border:3px solid var(--ink);font:700 28px/50px var(--narrow);text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.5);transform:translate(-50%,-50%) scale(0)}
.rows{display:flex;flex-direction:column;gap:34px}
.rows .row{display:grid;grid-template-columns:72px minmax(0,1fr);gap:0 26px;align-items:start}
.rows .row i{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;border:3px solid #fff;font:700 30px/1 var(--narrow);font-style:normal;color:#fff}
.rows .row b{display:block;font:600 40px/1.15 var(--narrow);color:#fff}
.rows .row span{display:block;font:400 28px/1.35 var(--sans);color:rgba(255,255,255,.8);margin-top:6px}
/* terminal */
#term{position:absolute;left:96px;top:120px;width:1728px;height:790px;background:var(--scope);border-radius:12px;border:1px solid #000;box-shadow:0 30px 80px -30px rgba(0,0,0,.8);color:var(--phosphor);padding:56px 44px 30px;font:400 26px/1.45 var(--mono);overflow:hidden}
#term .bar{position:absolute;left:0;right:0;top:0;height:40px;background:#141c1f;border-radius:12px 12px 0 0;border-bottom:1px solid #27343a}
#term .bar b{position:absolute;left:0;right:0;top:10px;text-align:center;font:500 17px/1 var(--narrow);color:#8a9aa2}
#term .m{color:#aab8b3;font-size:24px;margin-bottom:12px}
#term .c{color:#fff;white-space:pre-wrap;overflow-wrap:anywhere}
#term .pass{color:#6fe39a;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 26px}
#term .rows2{display:grid;grid-template-columns:70px minmax(0,1fr) 340px;gap:10px 18px;align-items:baseline;font-size:24px}
#term .rows2 .k{color:#6fe39a;font-weight:600}#term .rows2 .n{color:#dfe9e3}#term .rows2 .n small{display:block;color:#8a9aa2;font-size:18px;margin-top:2px}#term .rows2 .v{color:#8a9aa2;font-size:18px;text-align:right;white-space:nowrap}
#term .foot{position:absolute;left:44px;right:44px;bottom:28px;font:400 21px/1.4 var(--narrow);color:#8a9aa2;border-top:1px solid #27343a;padding-top:12px}
#term .foot b{color:#c9d4cf}
/* close */
.close .ch{font:600 56px/1.1 var(--narrow);color:#fff}
.close .ch .w{color:var(--fault-soft);text-decoration:underline;text-decoration-color:var(--fault);text-decoration-thickness:6px;text-underline-offset:9px;text-decoration-skip-ink:none}
.close .cname{font:600 120px/1 var(--narrow);color:#fff;letter-spacing:-.01em}
.close .ctag{font:500 44px/1.2 var(--narrow);color:rgba(255,255,255,.9)}
.close .curl{font:600 50px/1.1 var(--mono);color:#fff}
.close .cmeta{display:flex;gap:16px;align-items:center;font:500 28px/1.2 var(--narrow);color:rgba(255,255,255,.85)}
.close .cmeta i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5)}
.close .cfine{font:400 24px/1.4 var(--sans);color:rgba(255,255,255,.72)}
</style></head><body>
<div id="shots"></div>
<div id="cap"><span id="captxt"></span></div>
<script src="../../site/assets/common.js"></script>
<script src="shots.js"></script>
</body></html>
