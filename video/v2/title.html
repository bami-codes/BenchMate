<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>s1 title</title>
<link rel="stylesheet" href="common.css">
<style>
/* 0–5.2 s: the bench, a slow push-in. 5.2–11 s: the three sentences on the mat, typed on the beat; the third is the wrong one. */
#photo{position:absolute;inset:0;overflow:hidden;background:#2a3338}
#photo img{position:absolute;left:50%;top:50%;width:1920px;height:auto;transform-origin:center;transform:translate(-50%,-50%) scale(1)}
#photo .grade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.10) 0%,rgba(0,0,0,0) 35%,rgba(0,0,0,.28) 100%)}
#label{position:absolute;left:96px;bottom:84px;opacity:0}
#card{position:absolute;inset:0;opacity:0}
#lines{position:absolute;left:96px;right:96px;top:50%;transform:translateY(-52%)}
.ln{font:600 112px/1.08 var(--narrow);letter-spacing:-.008em;color:#fff;white-space:nowrap;height:122px;position:relative}
.ln .txt{position:relative;display:inline-block}
.ln.wrong .txt{color:var(--fault-soft)}
.ln.wrong .ul{position:absolute;left:0;bottom:-6px;height:9px;background:var(--fault);width:0;border-radius:2px}
.caret{display:inline-block;width:6px;height:96px;background:#fff;vertical-align:-10px;margin-left:8px;opacity:0}
#sub{position:absolute;left:96px;bottom:92px;font:500 34px/1.3 var(--narrow);color:rgba(255,255,255,.85);opacity:0;letter-spacing:.005em}
#sub b{color:#fff;font-weight:600}
</style></head><body>
<div id="photo"><img id="bench" src="../../examples/bench-photos/2026-11-04/full/camera-preview.png" alt=""><div class="grade"></div><div class="vignette"></div>
  <div id="label" class="tape white">The bench · 4 November 2026</div></div>
<div id="card"><div class="mat"></div>
  <div id="lines">
    <div class="ln" id="l1"><span class="txt"><span class="t"></span></span><span class="caret"></span></div>
    <div class="ln" id="l2"><span class="txt"><span class="t"></span></span><span class="caret"></span></div>
    <div class="ln wrong" id="l3"><span class="txt"><span class="t"></span><span class="ul"></span></span><span class="caret"></span></div>
  </div>
  <div id="sub"><b>BenchMate</b> — forecast-first experiments on a real circuit</div>
</div>
<script>
const S = ['The drawing is right.', 'The board is right.', 'The output is wrong.'];
const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (t, a, b) => { const x = clamp((t - a) / (b - a)); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const lin = (t, a, b) => clamp((t - a) / (b - a));
const $ = (s) => document.querySelector(s);
// typing: each sentence types over `dur` seconds starting at `t0`; the caret blinks while typing and rests after
function typed(el, text, t, t0, dur) {
  const n = Math.round(lin(t, t0, t0 + dur) * text.length);
  el.querySelector('.t').textContent = text.slice(0, n);
  const caret = el.querySelector('.caret'); const active = t >= t0 - .2 && t < t0 + dur + .35;
  caret.style.opacity = active ? ((Math.floor(t * 3) % 2) ? 1 : .25) : 0;
  return n >= text.length;
}
window.frame = (t) => {
  // photo: push-in 1.00 → 1.10 over the first 5.2 s on the instrument board; the label fades in at 0.8 s
  const z = 1 + .10 * ease(t, 0, 5.2);
  $('#bench').style.transform = `translate(-50%,-50%) translateY(${-120 + 40 * ease(t, 0, 5.2)}px) scale(${z})`;
  $('#label').style.opacity = ease(t, .8, 1.6) * (1 - ease(t, 4.4, 5.0));
  // crossfade to the card
  const c = ease(t, 4.8, 5.6); $('#card').style.opacity = c; $('#photo').style.opacity = 1 - c * .999;
  // three sentences: 5.6 → 6.4, 6.9 → 7.6, 8.1 → 9.0; the underline draws right after the third
  typed($('#l1'), S[0], t, 5.6, .8); typed($('#l2'), S[1], t, 6.9, .7); typed($('#l3'), S[2], t, 8.1, .9);
  $('#l3 .ul').style.width = (ease(t, 9.05, 9.6) * 100) + '%';
  $('#sub').style.opacity = ease(t, 9.7, 10.4);
};
frame(0);
</script>
</body></html>
