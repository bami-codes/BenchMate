<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>s7 close</title>
<link rel="stylesheet" href="common.css">
<style>
#wrap{position:absolute;left:96px;right:96px;top:50%;transform:translateY(-50%)}
.row{opacity:0;transform:translateY(14px)}
#h{font:600 64px/1.1 var(--narrow);color:#fff;letter-spacing:-.005em;margin:0 0 10px}
#h .w{color:var(--fault-soft);text-decoration:underline;text-decoration-color:var(--fault);text-decoration-thickness:6px;text-underline-offset:9px;text-decoration-skip-ink:none}
#name{font:600 120px/1 var(--narrow);color:#fff;letter-spacing:-.01em;margin:26px 0 8px}
#tag{font:500 44px/1.2 var(--narrow);color:rgba(255,255,255,.9);margin:0 0 42px}
#url{font:600 52px/1.1 var(--mono);color:#fff;margin:0 0 30px;letter-spacing:-.01em}
#meta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font:500 28px/1.2 var(--narrow);color:rgba(255,255,255,.85)}
#meta i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5);font-style:normal}
#built{margin-top:26px}
#built .tape{font-size:26px}
</style></head><body>
<div class="mat"></div>
<div id="wrap">
  <p id="h" class="row">The drawing is right. The board is right. <span class="w">The output is wrong.</span></p>
  <p id="name" class="row">BenchMate</p>
  <p id="tag" class="row">forecast-first experiments on a real circuit</p>
  <p id="url" class="row">bami-codes.github.io/BenchMate</p>
  <div id="meta" class="row"><span>Muse Spark 1.3 · Meta Model API</span><i></i><span>SAM 3.1</span><i></i><span>Arduino UNO R4</span><i></i><span>ngspice</span><i></i><span>MIT</span></div>
  <div id="built" class="row"><span class="tape">Built 27 Oct – 4 Nov 2026 · the first commit is the start of the project</span></div>
</div>
<script>
const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (t, a, b) => { const x = clamp((t - a) / (b - a)); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const rows = ['#h', '#name', '#tag', '#url', '#meta', '#built'];
window.frame = (t) => {
  rows.forEach((s, i) => { const e = ease(t, .3 + i * .45, 1.0 + i * .45); const el = document.querySelector(s); el.style.opacity = e; el.style.transform = `translateY(${14 * (1 - e)}px)`; });
};
frame(0);
</script>
</body></html>
