[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmate"
version = "0.1.0"
description = "Evidence-driven circuit experiments — hackathon development prototype"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "httpx>=0.27,<1", "pyserial>=3.5,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "Pillow>=10.4,<13"]
vision = ["Pillow>=10.4,<13"]

[project.scripts]
benchmate = "benchmate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
benchmate = ["*.html", "*.css", "*.js", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
